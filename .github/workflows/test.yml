name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    - name: Download dependencies
      run: go mod download

    - name: Run unprivileged logic tests
      run: go test -v ./pkg/models ./pkg/matching ./pkg/verification

    - name: Run privileged probe & E2E tests (requires sudo)
      # GitHub Actions runners allow passwordless sudo!
      # This runs the tests that would normally be skipped on a local unprivileged machine.
      run: sudo go test -v ./pkg/probe/fs ./tests/e2e
